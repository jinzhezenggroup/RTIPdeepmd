[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rtipdeepmd"
version = "0.1.0"
description = "RTIP evolution MD driven by a DeepMD potential (Python port of the Rust RTIP-MD)"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
deepmd = ["deepmd-kit>=3"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["rtipdeepmd*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
